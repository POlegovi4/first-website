            body {
                background-color: #0f172a;
                color: rgb(155, 151, 151);

                margin-top: 0%;
            }
            .my-button {
                display: inline-block;
                padding: 10px 20px;
                margin: 5px;
                background-color: #0088cc;
                color: white;
                text-decoration: none;
                border-radius: 8px;
                font-weight: bold;
                transition: background-color 0.3s;
                animation: breathe 2.5s infinite ease-in-out;
            }

            .bth-tg {
                background-color: #0088cc;
            }
            .bth-tg:hover {
                background-color: #006699;
            }

            .btn-phone {
                background-color: #2e7d32;
            }
            .btn-phone:hover {
                background-color: #1b5e20;
            }
            .video-frame {
                border-radius: 16px;
                box-shadow: 0 10px 30px rgba(0. 0. 0. 0.5);
                border: none;
                transition: transform 0.3s ease;
            }
            .video-frame:hover {
                transform: scale(1.01);
            }
            .profile-photo {
                width: 220px;
                height: 220px;
                border-radius: 50%;
                object-fit: cover;
                border: 4px solid #5b656a;
                box-shadow: 0 5px 15px rgba(0. 0. 0. 0.3);
            }
            h1 {
                color: white;
                font-size: 42px;
                margin-bottom: 5px;
                margin-top: 10px;
            }
            p {
                font-size: 18px;
                line-height: 1.6;
            }
            .profile-card {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 50px;
                margin-bottom: 40px;
            }
            .skills-block {
                text-align: left;
            }
            .skills-block h2 {
                margin-top: 0;
            }
            @keyframes breathe {
                0% {transform: scale(1);}
                50% {transform: scale(1.05);}
                100%{transform: scale(1);}
            }
        </style>
    </head>
    <body>
